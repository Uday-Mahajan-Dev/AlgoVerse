version: '3.8'

services:
  judge0:
    image: judge0/judge0:1.13.1
    container_name: algoverse_judge0
    privileged: true
    cgroup: host
    volumes:
      - ./judge0.conf:/judge0.conf:ro
      - ./isolate_job.rb:/api/app/jobs/isolate_job.rb:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0
      - POSTGRES_DB=judge0
      - MAX_MEMORY_LIMIT=1024000
      - MAX_CPU_TIME_LIMIT=15.0
      - MAX_WALL_TIME_LIMIT=30.0
      - ENABLE_ISOLATE_CGROUP=false
      - USE_CGROUP=false
      - BOX_USE_CGROUP=false
      - ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
      - ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
    depends_on:
      - redis
      - db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: algoverse_judge0_redis
    restart: always

  db:
    image: postgres:15-alpine
    container_name: algoverse_judge0_db
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  judge0_postgres_data:
