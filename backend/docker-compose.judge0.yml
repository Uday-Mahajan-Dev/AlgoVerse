version: '3.8'

services:
  judge0:
    image: judge0/judge0:1.13.1
    container_name: algoverse_judge0
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0
      - POSTGRES_DB=judge0
    depends_on:
      - redis
      - db
    restart: always

  redis:
    image: redis:7-alpine
    container_name: algoverse_judge0_redis
    restart: always

  db:
    image: postgres:15-alpine
    container_name: algoverse_judge0_db
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  judge0_postgres_data:
